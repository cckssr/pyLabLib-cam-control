[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pylablib-cam-control"
version = "2.2.1"
description = "GUI application for controlling and streaming from scientific cameras, built on pylablib"
readme = "README.rst"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "pylablib>=1.4.5",
    "PyQt5>=5.15.11",
    "pyqtgraph>=0.14",
    "numpy>=2",
    "scipy>=1.11",
    "pandas>=2",
    "numba>=0.61",
    "imageio>=2.34",
    "Pillow>=10",
    "rpyc>=6",
    "qdarkstyle>=3.2",
    "plumbum>=1.8",
    "python-dateutil>=2.9",
    "six>=1.16",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
    "pytest>=8",
    "pytest-qt>=4",
    "setuptools>=68",  # pack.py needs this for the distutils compatibility shim on Python 3.12+
]

[project.scripts]
cam-control = "camcontrol.splash:main"
cam-control-console = "camcontrol.app:main"
cam-control-detect = "camcontrol.detect:main"

[tool.setuptools.packages.find]
include = ["camcontrol*"]

[tool.setuptools.package-data]
"camcontrol.resources" = ["*.ico", "*.png"]
